server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Forward /api/* to the `api` service in the same compose project, with /api stripped.
  # The resolver + variable make nginx look up `api` per request, so it still starts
  # when Angular runs alone (then /api just answers 502).
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files never change: cache for a year
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: unknown paths fall back to index.html, which must never be cached
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}